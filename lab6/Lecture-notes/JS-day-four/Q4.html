<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex4 - JSON</title>
    <style>
      body { font-family: system-ui, Arial; padding: 16px; }
      table { border-collapse: collapse; width: 100%; margin-top: 12px; }
      td, th { border: 1px solid #ddd; padding: 8px; }
      body.dark {
  background-color: #121212;
  color: #f5f5f5;
}

body.dark button {
  background: #333;
  color: #fff;
}
    </style>
  </head>
  <body>
    <h1>JSON Practice</h1>
    <button id="run">Run</button>
    <div id="app"></div>
<button id="themeToggle">Toggle Theme</button>

 <script>

  const runBtn = document.querySelector('#run');
  const app = document.querySelector('#app');

   var createUsers = [
      { "id": "1", "name": 'Alice', "email": 'alice@example.com' },
      { "id": "2", "name": 'Bob', "email": 'bob@example.com' },
      { "id": "3", "name": 'Charlie', "email": 'charlie@example.com' },
      { "id": "4", "name": 'David', "email": 'david@example.com' },
      {"id":"5" , "name" : "mahmoud" , "email" : 'mahmoud@example.com' }
      
    ] ; 


      function run() {
    var users = createUsers ;
    var jsonText = JSON.stringify(users);
    var usersAgain = JSON.parse(jsonText);
    renderTable(usersAgain);
  }


  runBtn.addEventListener('click', run);

  function renderTable(users) {
    app.innerHTML = '';

    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var tbody = document.createElement('tbody');

    var headerRow = document.createElement('tr');
    ['ID', 'Name', 'Email'].forEach(text => {
      var th = document.createElement('th');
      th.textContent = text;
      headerRow.appendChild(th);
    });

    thead.appendChild(headerRow);

    users.forEach(user => {
      var row = document.createElement('tr');

      var idCell = document.createElement('td');
      idCell.textContent = user.id;

      var nameCell = document.createElement('td');
      nameCell.textContent = user.name;

      var emailCell = document.createElement('td');
      emailCell.textContent = user.email;

      row.append(idCell, nameCell, emailCell);
      tbody.appendChild(row);
    });

    table.append(thead, tbody);
    app.appendChild(table);
  }


const themeToggleBtn = document.querySelector('#themeToggle');

  themeToggleBtn.addEventListener('click', toggleTheme);

  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark');

    if (isDark) {
      document.cookie = 'theme=dark; path=/; max-age=604800';
    } else {
      document.cookie = 'theme=light; path=/; max-age=604800';
    }
  }

  function applySavedTheme() {
    const cookies = document.cookie.split('; ');
    const themeCookie = cookies.find(cookie => cookie.startsWith('theme='));

    if (themeCookie) {
      const themeValue = themeCookie.split('=')[1];
      if (themeValue === 'dark') {
        document.body.classList.add('dark');
      }
    }
  }

  applySavedTheme();


</script>

  </body>
</html>
