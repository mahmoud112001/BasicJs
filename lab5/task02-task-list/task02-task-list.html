<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task List</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="task02-style.css">
</head>
<body>

<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <span class="tag">// task manager</span>
    <h1>My Tasks</h1>
  </div>

  <!-- Input -->
  <div class="input-card">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..."/>
      <button class="btn btn-yellow" id="addBtn">+ Add</button>
    </div>
    <span class="err-msg" id="taskErr"></span>
  </div>

  <!-- Stats + filters -->
  <div class="stats">
    <span class="stat-pill" id="totalPill">Total: 0</span>
    <span class="stat-pill active" id="donePill">Done: 0</span>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
    </div>
    <button class="clear-btn" onclick="clearDone()">Clear Done</button>
  </div>

  <!-- Task list -->
  <ul class="task-list" id="taskList"></ul>

  <!-- Empty state -->
  <div class="empty" id="emptyState">
    <span class="empty-icon">📋</span>
    No tasks here yet!
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="task02-script.js"></script>
</body>
</html>
