<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome — Mahmoud Awad</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:     #0a0a0f;
      --accent: #f05f40;
      --text:   #e8e8f0;
      --muted:  #55556a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(240,95,64,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,95,64,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(240,95,64,0.07) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      50%      { transform: translate(-50%,-50%) scale(1.15); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }

    .dot {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(240,95,64,0.5); }
      50%      { box-shadow: 0 0 0 8px rgba(240,95,64,0); }
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
    }

    h1 span { color: var(--accent); }

    .name {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.85rem, 2vw, 1rem);
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
    }

    .video-wrap {
      width: min(600px, 90vw);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(240,95,64,0.2);
      box-shadow: 0 0 60px rgba(240,95,64,0.08);
      animation: fadeUp 0.8s 0.2s ease both;
      animation-fill-mode: both;
    }

    .video-wrap iframe {
      display: block;
      width: 100%;
      height: 320px;
      border: none;
    }

    .skip-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid rgba(240,95,64,0.3);
      color: var(--muted);
      padding: 12px 28px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.25s;
      animation: fadeUp 0.8s 0.4s ease both;
      animation-fill-mode: both;
    }

    .skip-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .skip-btn .arrow { transition: transform 0.25s; }
    .skip-btn:hover .arrow { transform: translateX(4px); }

    .countdown {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .countdown span { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="tag"><span class="dot"></span> Portfolio Intro</div>
    <h1>Welcome<span>.</span></h1>
    <p class="name">// Mahmoud Awad Saad</p>

    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/2mRlUWNIPzo?autoplay=1&mute=1"
        title="Welcome animation"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <a href="./home.html" class="skip-btn">
      Skip Intro <span class="arrow">→</span>
    </a>

    <p class="countdown">Auto redirect in <span id="timer">10</span>s</p>
  </div>

  <script>
    let seconds = 10;
    const timerEl = document.getElementById('timer');
    const interval = setInterval(() => {
      seconds--;
      timerEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = './home.html';
      }
    }, 1000);
  </script>

</body>
</html>
